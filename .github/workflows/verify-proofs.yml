name: AGI@home Proofs CI

on:
  push:
    branches:
      - main
    paths:
      - 'proofs/**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lakefile.lean'
  pull_request:
    branches:
      - main
    paths:
      - 'proofs/**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lakefile.lean'
  workflow_dispatch:
  workflow_call:
    inputs:
      lean_toolchain:
        required: false
        type: string
        default: leanprover/lean4:v4.14.0
      target:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: proofs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-proofs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proofs repository
        uses: actions/checkout@v4

      - name: Install elan and pinned Lean toolchain
        shell: bash
        env:
          INPUT_TOOLCHAIN: ${{ inputs.lean_toolchain }}
        run: |
          TOOLCHAIN="$INPUT_TOOLCHAIN"
          if [ -z "$TOOLCHAIN" ] && [ -f lean-toolchain ]; then
            TOOLCHAIN=$(tr -d '[:space:]' < lean-toolchain)
          fi
          TOOLCHAIN="${TOOLCHAIN:-leanprover/lean4:v4.14.0}"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | \
            sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake packages and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Fetch Mathlib cache and build proofs
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          BUILD_LOG=$(mktemp)
          if [ -n "$INPUT_TARGET" ]; then
            lake exe cache get && lake build "$INPUT_TARGET" 2>&1 | tee "$BUILD_LOG"
          else
            lake exe cache get && lake build 2>&1 | tee "$BUILD_LOG"
          fi
          if grep -qE "declaration uses 'sorry'|sorryAx" "$BUILD_LOG"; then
            echo "Build contains sorry" >&2
            exit 1
          fi
